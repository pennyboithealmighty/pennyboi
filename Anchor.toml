[toolchain]
anchor_version = "1.2.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
vault = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.localnet]
vault = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
url = "https://api.apr.dev"

[provider]
# `anchor test` runs against an ephemeral LOCAL validator (fast, offline, free
# airdrops). Actual network deploys are devnet-only and done via scripts/deploy
# with `--provider.cluster devnet`. No mainnet endpoint appears anywhere.
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm --filter @pennyboi/tests test"
