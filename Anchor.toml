[toolchain]
anchor_version = "1.2.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
vault = "4bNohxQ1BzN2zDLHixfgf4vd6dqwbdPddmQZ5eioX8HA"

[programs.localnet]
vault = "GC7kdK4aEX9YsYSpiZ4VFJDw6Q8MtAPQgqjEjpSnVrac"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "tests/node_modules/.bin/ts-mocha -p tests/tsconfig.json -t 1000000 'tests/vault.ts'"

[hooks]

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
