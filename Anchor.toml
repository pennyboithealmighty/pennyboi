[toolchain]
anchor_version = "1.2.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
vault = "4bNohxQ1BzN2zDLHixfgf4vd6dqwbdPddmQZ5eioX8HA"

[programs.localnet]
vault = "GC7kdK4aEX9YsYSpiZ4VFJDw6Q8MtAPQgqjEjpSnVrac"
# Test-only mock venues (docs/13 §6). Never deployed to devnet/mainnet.
mock_venue = "Er4xBs7mvh138XYpZSAEQZfqJJgxSNKxGy6fwjLyFZzj"
mock_evil_venue = "FFmYCS3uLRH1865Z8ZrWbLtVfS8gTiwfQDYdDApcSimQ"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# vault.ts (banking) and buyback.ts both initialize the singleton Config PDA, so
# they can't share one validator — run each in its own `anchor test`. Default is
# the banking suite; set TEST_FILE=tests/buyback.ts for the buyback suite.
test = "tests/node_modules/.bin/ts-mocha -p tests/tsconfig.json -t 1000000 ${TEST_FILE:-tests/vault.ts}"

[hooks]

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
