[toolchain]
anchor_version = "1.2.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
vault = "4bNohxQ1BzN2zDLHixfgf4vd6dqwbdPddmQZ5eioX8HA"

[programs.localnet]
vault = "4bNohxQ1BzN2zDLHixfgf4vd6dqwbdPddmQZ5eioX8HA"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# NOTE: Anchor 1.x defaults `anchor test`/`anchor localnet` to Surfpool, which
# fails to build from crates.io here. There is no Anchor.toml switch for the
# backend, so run the tests against the classic validator with the flag:
#   anchor test --validator legacy
# (uses solana-test-validator; `programs.localnet` above is loaded at genesis).
# [test.validator] below configures that legacy validator.
[test.validator]
bind_address = "127.0.0.1"

[scripts]
# `anchor test` runs this from the repo root (where Anchor.toml lives), so
# anchor.workspace can find it. Invoke ts-mocha directly rather than via
# `pnpm --filter`, which would re-root the cwd into tests/ and break the
# Anchor.toml lookup. Paths are relative to the repo root; the test file's own
# `../target/...` imports still resolve from tests/.
test = "tests/node_modules/.bin/ts-mocha -p tests/tsconfig.json -t 1000000 'tests/vault.ts'"

[hooks]
