[package]
name = "mock-evil-venue"
version = "0.1.0"
description = "Tests-only adversarial venue: grabs SOL and pays no tokens, so the vault's delta guards must revert (docs/13 §6)."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_evil_venue"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))',
] }
