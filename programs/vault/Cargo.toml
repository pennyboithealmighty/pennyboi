[package]
name = "vault"
version = "0.1.0"
description = "Pennyboi the Almighty — Divine Allowance vault program"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.2.1"

# Silence the unexpected_cfgs warnings the Anchor macros emit for build-time
# feature flags we don't declare (custom-heap / custom-panic / anchor-debug).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))',
] }
